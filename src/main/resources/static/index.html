<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>WebSocket Test</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body>
<h2>칸반보드 동시성 테스트</h2>
<p>내 Client UUID: <b id="myUuid"></b></p>

<button onclick="connect()">1. 접속하기</button>
<button onclick="sendMoveTest()">2. 카드 이동 시도 (경쟁)</button>

<hr/>
<ul id="messages"></ul>

<script>
    var stompClient = null;
    // 접속할 때마다 랜덤한 ID 생성 (마치 다른 유저인 척)
    var myUuid = 'user-' + Math.random().toString(36).substr(2, 9);
    document.getElementById("myUuid").innerText = myUuid;

    function connect() {
        var socket = new SockJS('/ws');
        stompClient = Stomp.over(socket);
        stompClient.connect({}, function (frame) {
            console.log('Connected: ' + frame);

            stompClient.subscribe('/sub/board/1', function (message) {
                var body = JSON.parse(message.body);
                handleMessage(body);
            });
        });
    }

    function sendMoveTest() {
        // 테스트용: DB에 실제 존재하는 ID로 수정 필요
        stompClient.send("/pub/card/move", {}, JSON.stringify({
            'cardId': 1,           // 테스트할 카드 ID
            'targetColumnId': 1,
            'prevCardId': null,
            'nextCardId': null,
            'clientUuid': myUuid   // [중요] 내 신분증 함께 전송
        }));
    }

    function handleMessage(body) {
        var li = document.createElement("li");

        if (body.type === "ERROR" && body.errorCode === "CONCURRENCY_FAIL") {
            // 에러 메시지가 왔는데, 내 UUID랑 같다면? -> 내가 충돌난 것!
            if (body.clientUuid === myUuid) {
                alert("⚠️ " + body.message);
                li.style.color = "red";
                li.innerText = "[실패] " + body.message;
            } else {
                // 남이 충돌난 건 무시하거나 로그만 찍음
                console.log("다른 사용자가 충돌을 겪었습니다.");
                return;
            }
        } else if (body.type === "SUCCESS") {
            li.style.color = "blue";
            li.innerText = "[성공] 카드가 " + body.newPosition + " 위치로 이동했습니다.";
        }

        document.getElementById("messages").appendChild(li);
    }
</script>
</body>
</html>
